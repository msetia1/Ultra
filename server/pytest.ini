[pytest]
# Pytest configuration for calendar integration tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio mode
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Test markers
markers =
    asyncio: marks tests as async (deselect with '-m "not asyncio"')
    integration: marks tests as integration tests (slow, hits real endpoints)

# Environment variables
env =
    ENVIRONMENT=test
    # TEST_API_BASE_URL=http://localhost:8000  # Override to test different server
